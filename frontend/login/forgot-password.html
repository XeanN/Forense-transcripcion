<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contrasena - Forense App</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Recuperar contrasena</h1>
    <p class="subtitle" id="subtitle">Ingresa tu usuario para continuar</p>

    <form id="username-form">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <button type="submit" class="primary" id="username-btn">Continuar</button>
      <div class="message" id="username-message"></div>
    </form>

    <form id="question-form" class="hidden">
      <p class="subtitle" id="question-text"></p>
      <div class="field">
        <label for="answer">Tu respuesta</label>
        <div class="password-wrapper">
          <input type="password" id="answer" required />
          <button type="button" class="toggle-password" id="toggle-answer">Mostrar</button>
        </div>
      </div>
      <div class="field">
        <label for="new-password">Nueva contrasena</label>
        <div class="password-wrapper">
          <input type="password" id="new-password" minlength="8" required />
          <button type="button" class="toggle-password" id="toggle-new-password">Mostrar</button>
        </div>
      </div>
      <button type="submit" class="primary" id="question-btn">Restablecer contrasena</button>
      <div class="message" id="question-message"></div>
    </form>

    <div class="message" id="done-message"></div>

    <div class="links">
      <a href="/login/index.html">Volver a iniciar sesion</a>
    </div>
  </div>

  <script>
    function setupToggle(buttonId, inputId) {
      const btn = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      btn.addEventListener('click', () => {
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.textContent = isHidden ? 'Ocultar' : 'Mostrar';
      });
    }
    setupToggle('toggle-answer', 'answer');
    setupToggle('toggle-new-password', 'new-password');

    const usernameForm = document.getElementById('username-form');
    const questionForm = document.getElementById('question-form');
    const usernameMessage = document.getElementById('username-message');
    const questionMessage = document.getElementById('question-message');
    const doneMessage = document.getElementById('done-message');
    const subtitle = document.getElementById('subtitle');

    let currentUsername = '';

    usernameForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      usernameMessage.className = 'message';
      const btn = document.getElementById('username-btn');
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        currentUsername = document.getElementById('username').value.trim();
        const res = await fetch('/api/auth/recovery-start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: currentUsername }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error inesperado');

        if (data.method === 'email') {
          usernameForm.classList.add('hidden');
          doneMessage.textContent = data.message;
          doneMessage.className = 'message success';
        } else if (data.method === 'question') {
          usernameForm.classList.add('hidden');
          questionForm.classList.remove('hidden');
          subtitle.textContent = `Usuario: ${currentUsername}`;
          document.getElementById('question-text').textContent = data.question;
        } else {
          usernameMessage.textContent =
            'No hay una recuperacion disponible para ese usuario en este momento. Contacta al administrador.';
          usernameMessage.className = 'message error';
        }
      } catch (err) {
        usernameMessage.textContent = err.message;
        usernameMessage.className = 'message error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Continuar';
      }
    });

    questionForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      questionMessage.className = 'message';
      const btn = document.getElementById('question-btn');
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const res = await fetch('/api/auth/security-answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: currentUsername,
            answer: document.getElementById('answer').value,
            newPassword: document.getElementById('new-password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error inesperado');

        questionForm.classList.add('hidden');
        doneMessage.textContent = 'Contrasena actualizada. Ya puedes iniciar sesion.';
        doneMessage.className = 'message success';
      } catch (err) {
        questionMessage.textContent = err.message;
        questionMessage.className = 'message error';
        btn.disabled = false;
        btn.textContent = 'Restablecer contrasena';
      }
    });
  </script>
</body>
</html>
