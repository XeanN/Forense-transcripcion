<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contrasena - Forense App</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="card">
    <h1>Recuperar contrasena</h1>
    <p class="subtitle">Te enviaremos un link a tu correo registrado</p>

    <form id="forgot-form">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>

      <button type="submit" class="primary" id="submit-btn">Enviar link de recuperacion</button>

      <div class="message" id="message"></div>
    </form>

    <div class="links">
      <a href="/login/index.html">Volver a iniciar sesion</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgot-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.username.value.trim() }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error inesperado');

        messageEl.textContent = data.message;
        messageEl.className = 'message success';
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'message error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar link de recuperacion';
      }
    });
  </script>
</body>
</html>
