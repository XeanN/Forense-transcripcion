<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contrasena - Forense App</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="card">
    <h1>Restablecer contrasena</h1>
    <p class="subtitle">Ingresa tu nueva contrasena</p>

    <form id="reset-form">
      <div class="field">
        <label for="new-password">Nueva contrasena</label>
        <div class="password-wrapper">
          <input type="password" id="new-password" name="newPassword" minlength="8" required />
          <button type="button" class="toggle-password" id="toggle-password">Mostrar</button>
        </div>
      </div>

      <button type="submit" class="primary" id="submit-btn">Restablecer contrasena</button>

      <div class="message" id="message"></div>
    </form>

    <div class="links">
      <a href="/login/index.html">Volver a iniciar sesion</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const form = document.getElementById('reset-form');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('new-password');

    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.textContent = isHidden ? 'Ocultar' : 'Mostrar';
    });

    if (!token) {
      messageEl.textContent = 'Falta el token de recuperacion en el link.';
      messageEl.className = 'message error';
      submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: passwordInput.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error inesperado');

        messageEl.textContent = 'Contrasena actualizada. Ya puedes iniciar sesion.';
        messageEl.className = 'message success';
        submitBtn.style.display = 'none';
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'message error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Restablecer contrasena';
      }
    });
  </script>
</body>
</html>
